name: Generate resume PDF

on:
  push:
    branches: [main]
    paths:
      - resume.html
      - custom.css
      - .github/scripts/generate-resume-pdf.sh
      - .github/workflows/resume-pdf.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1
      - name: Generate PDF
        env:
          CHROME_BIN: chrome
          DBUS_SESSION_BUS_ADDRESS: /dev/null
        run: bash .github/scripts/generate-resume-pdf.sh
      - name: Commit PDF if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/Satish_Fulwani_Resume.pdf
          git diff --staged --quiet || git commit -m "chore: regenerate resume PDF"
          git push
